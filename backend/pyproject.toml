[project]
name = "damage-backend"
version = "0.1.0"
description = "Damage detection (SAM 3) + 3D localization backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "requests>=2.32",
    "pillow>=10.4",
    "numpy>=2.0",
    "pillow-heif>=1.8.1",
    "open3d>=0.20.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
