[project]
name = "deepsplat"
version = "0.2.0"
description = "DeepSplat: damage inspection on a Gaussian-splat digital twin (backend, inspection, localization)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "requests>=2.32",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "reportlab>=4.2",
]

[project.optional-dependencies]
# Google Cloud deployment: GCS storage with signed URLs, Cloud SQL (Postgres)
gcp = ["google-cloud-storage>=2.18", "psycopg[binary]>=3.2"]
# hloc VPS: see localization/requirements-vps.txt (git dependency, installed separately)

[dependency-groups]
# elevation / traversability map (python -m elevmap), see elevmap/README.md
elevmap = ["scipy>=1.13", "matplotlib>=3.9"]
dev = ["pytest>=8", "httpx>=0.27", { include-group = "elevmap" }]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
