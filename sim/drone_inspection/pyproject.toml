[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsplat-drone-inspection"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23,<2", "scipy>=1.9,<1.14", "trimesh==4.5.3", "pybullet==3.2.7", "transforms3d==0.4.2", "fastapi>=0.100,<1", "uvicorn>=0.23,<1", "pillow>=9,<12", "websockets==12.0"]

[tool.setuptools]
packages = ["inspection_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
