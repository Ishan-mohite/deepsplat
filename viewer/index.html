<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>deepsplat console</title>
<link rel="icon" type="image/svg+xml" href="../design/brand/logos/deepsplat-icon-16.svg">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../design/system/tokens.css">
<link rel="stylesheet" href="../design/system/components.css">
<script type="importmap">
{
  "imports": {

  }
}
</script>
<style>
/* Tokens and ds-* components come from design/system (see DESIGN.md). Only viewer layout lives here. */
:root {
  --top-h: 64px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; }
button { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.mono { font-family: var(--font-mono); font-size: .92em; letter-spacing: -.01em; }
.eyebrow { font: var(--text-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--blue); }
.hint { font: var(--text-body-s); color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 30; height: var(--top-h); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-4); padding: 0 var(--space-6); background: var(--paper); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; justify-self: start; border-radius: var(--r-sm); }
.brand img { height: 32px; width: auto; display: block; }
.tabs { background: var(--paper-2); }
.tabs .tab:hover { color: var(--ink); }
.tabs .tab[aria-selected="true"] { background: var(--ink); color: #fff; font-weight: 600; }
.top-right { justify-self: end; display: flex; align-items: center; gap: var(--space-3); }
.site-select { position: relative; }
.site-select select { appearance: none; -webkit-appearance: none; height: 40px; border: 1px solid var(--line-2); background: var(--card); padding: 0 34px 0 var(--space-4); border-radius: var(--r-pill); font: var(--text-label); color: var(--ink); cursor: pointer; max-width: 260px; }
.site-select::after { content: ""; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.sample-chip { background: var(--amber-soft); border-color: transparent; color: var(--amber); font-weight: 600; }
.avatar { height: 34px; padding: 0 var(--space-3); border-radius: var(--r-pill); background: var(--paper-2); color: var(--ink); display: grid; place-items: center; font: 600 12px var(--font-display); flex: none; }

.view { display: none; }
.view.active { display: block; }

/* ---------- shared bits ---------- */
.ds-card { min-width: 0; }
.card-title { font: var(--text-display-s); letter-spacing: -0.01em; margin: 0 0 var(--space-1); }
.chip-link { cursor: pointer; }
.chip-link:hover { border-color: var(--ink-2); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }

/* ---------- dashboard ---------- */
.dash { padding: var(--space-6); max-width: 1480px; margin: 0 auto; display: grid; gap: var(--space-4); grid-template-columns: minmax(0, 1.62fr) minmax(0, 1fr) minmax(0, .98fr); grid-template-areas: "hero kpis side" "hero bars side"; }
.hero { grid-area: hero; display: flex; flex-direction: column; }
.hero-head { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin-top: var(--space-2); }
.hero .ds-meta { margin-top: var(--space-2); }
.hero-plan { flex: 1; min-height: 300px; margin: var(--space-3) -8px var(--space-2); display: flex; align-items: center; }
.hero-plan svg { width: 100%; height: auto; display: block; }
.plan-empty { margin: 0 8px; color: var(--muted); font: var(--text-body-s); }
.hero-actions { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; }
.hero-actions .hint { margin-left: auto; }
.kpis { grid-area: kpis; display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.bars { grid-area: bars; }
.bars-head { display: flex; justify-content: space-between; align-items: baseline; }
.bars svg { width: 100%; height: auto; display: block; margin-top: var(--space-2); overflow: visible; }
.bars .bar { cursor: default; }
.bars .bar:hover path.mark { opacity: .8; }
.side { grid-area: side; display: grid; gap: var(--space-4); align-content: start; }
.donut-wrap { display: flex; align-items: center; gap: var(--space-5); margin-top: var(--space-3); }
.donut-wrap svg { width: 116px; height: 116px; flex: none; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); font: var(--text-label); }
.legend li { display: flex; align-items: center; gap: var(--space-2); }
.legend .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.legend .note { font: var(--text-body-s); color: var(--muted); margin-top: var(--space-1); }
.records { list-style: none; margin: var(--space-3) 0 0; padding: 0; display: grid; gap: var(--space-1); }
.records .ds-row { width: 100%; text-align: left; background: none; border: 0; padding: var(--space-2); border-radius: var(--r-sm); cursor: pointer; }
.records .ds-row:hover { background: var(--paper); }
.records .ds-row__title, .records .ds-row__meta { display: block; }
.ds-row__thumb { overflow: hidden; border: 1px solid var(--line); }
.ds-row__thumb svg { width: 100%; height: 100%; display: block; }

/* ---------- twin ---------- */
.twin { display: grid; grid-template-columns: 284px minmax(0, 1fr) 380px; height: calc(100vh - var(--top-h)); }
.panel { overflow: auto; background: var(--card); border-right: 1px solid var(--line); }
.inspector { border-right: 0; border-left: 1px solid var(--line); }
.psec { padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--line); }
.psec:last-child { border-bottom: 0; }
.psec .eyebrow { margin-bottom: var(--space-3); }
.row-between { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-3); }
.switch { position: relative; display: inline-block; width: 40px; height: 23px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--line-2); border-radius: var(--r-pill); transition: background .15s; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 17px; height: 17px; border-radius: 50%; background: var(--card); transition: transform .15s; }
.switch input:checked + span { background: var(--blue); }
.switch input:checked + span::after { transform: translateX(17px); }
.switch input:focus-visible + span { box-shadow: var(--focus-ring); }
.slider-row { display: grid; gap: 6px; margin-top: var(--space-3); font: var(--text-body-s); color: var(--ink-2); }
input[type="range"] { width: 100%; accent-color: var(--blue); }
.cls-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.cls summary { list-style: none; display: grid; grid-template-columns: 12px 1fr auto 28px; align-items: center; gap: 9px; padding: 6px; border-radius: var(--r-sm); cursor: pointer; font: var(--text-label); }
.cls summary::-webkit-details-marker { display: none; }
.cls summary:hover { background: var(--paper); }
.cls .cnt { color: var(--muted); font-size: 11.5px; }
.cls.off summary .cls-name, .cls.off summary .cnt { opacity: .45; text-decoration: line-through; }
.eye { width: 28px; height: 24px; border: 0; background: none; border-radius: 6px; cursor: pointer; display: grid; place-items: center; color: var(--ink-2); }
.eye:hover { background: var(--paper-2); }
.eye svg { width: 16px; height: 16px; }
.inst { list-style: none; margin: 2px 0 6px 21px; padding: 0; border-left: 1px solid var(--line); }
.inst button { width: 100%; display: flex; justify-content: space-between; gap: var(--space-2); background: none; border: 0; text-align: left; padding: 4px 8px; font: var(--text-body-s); color: var(--ink-2); cursor: pointer; border-radius: 6px; }
.inst button:hover, .inst button.on { background: var(--paper); color: var(--ink); }
.inst .mono { color: var(--muted); font-size: 11px; }
.chip-toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-toggle { cursor: pointer; }
.chip-toggle[aria-pressed="true"] { border-color: var(--ink-2); }
.chip-toggle[aria-pressed="false"] { opacity: .45; }
.chip-toggle[aria-pressed="false"] .ds-sev::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--sev); }
.check-row { display: flex; justify-content: space-between; align-items: center; margin-top: var(--space-3); font: var(--text-label); }

.stage { position: relative; overflow: hidden; min-height: 320px; border-radius: 0; }
.canvas-host { position: absolute; inset: 0; }
.canvas-host canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
.stage-top { position: absolute; left: 14px; top: 14px; right: 14px; display: flex; gap: var(--space-2); align-items: center; pointer-events: none; flex-wrap: wrap; }
.stage-top > * { pointer-events: auto; }
.glass { background: var(--vp-2); border: 1px solid var(--vp-line); color: var(--vp-ink); border-radius: var(--r-pill); }
.stage-chip { height: 32px; padding: 0 var(--space-3); font: var(--text-label); display: inline-flex; gap: var(--space-2); align-items: center; }
.stage-chip .mono { color: var(--vp-muted); }
.stage-btn { height: 32px; padding: 0 var(--space-3); font: var(--text-label); cursor: pointer; }
.stage-btn:hover { border-color: var(--vp-muted); }
.stage-help { position: absolute; left: 16px; bottom: 86px; font-size: 11.5px; color: var(--vp-muted); pointer-events: none; }
.pin-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
/* Pins on the viewport: open findings in --vp-rust, everything else in --pick, 2 px --vp ring */
.pin { --pin: var(--pick); --callout: var(--blue); position: absolute; left: 0; top: 0; pointer-events: auto; border: 0; background: none; padding: 0; cursor: pointer; display: flex; align-items: center; gap: var(--space-2); will-change: transform; border-radius: var(--r-pill); }
.pin.is-open { --pin: var(--vp-rust); --callout: var(--rust); }
.pin-dot { width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--pin); box-shadow: 0 0 0 2px var(--vp); flex: none; position: relative; }
.pin.is-worsening .pin-dot::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 2px solid var(--pin); opacity: .7; animation: ping 1.8s ease-out infinite; }
.pin-label { margin-top: -7px; display: none; align-items: center; gap: 6px; height: 30px; padding: 0 var(--space-3); border-radius: var(--r-pill); background: var(--card); color: var(--ink); border: 1.5px solid var(--callout); font: 600 12px/1 var(--font-body); white-space: nowrap; box-shadow: var(--shadow-float); }
.pin-label .mono { color: var(--ink-2); font-weight: 400; font-size: 11px; }
.pin:hover .pin-label, .pin:focus-visible .pin-label, .pin.selected .pin-label { display: inline-flex; }
.pin.selected { z-index: 2; }
/* VPS layer: one diamond per localized capture (green = above the pose threshold, amber = below) */
.vps-mark { --m: var(--seg-3); position: absolute; left: 0; top: 0; pointer-events: auto; border: 0; background: none; padding: 0; cursor: pointer; display: flex; align-items: center; gap: 6px; will-change: transform; border-radius: var(--r-pill); }
.vps-mark.low { --m: var(--seg-4); }
.vps-mark i { width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 3px; background: var(--vp); border: 2px solid var(--m); transform: rotate(45deg); flex: none; }
.vps-mark span { margin-top: -6px; display: none; padding: 3px 9px; border-radius: var(--r-pill); background: var(--vp-2); color: var(--vp-ink); border: 1px solid var(--vp-line); font: var(--text-mono-s); white-space: nowrap; }
.vps-mark:hover span, .vps-mark:focus-visible span, .vps-mark.selected span { display: inline-block; }
.vps-mark.selected { z-index: 2; }
.vps-mark.selected i { background: var(--m); box-shadow: 0 0 0 6px color-mix(in srgb, var(--m) 30%, transparent); }
.pin.selected .pin-dot { box-shadow: 0 0 0 2px var(--vp), 0 0 0 8px color-mix(in srgb, var(--pin) 28%, transparent); }
@keyframes ping { from { transform: scale(.6); opacity: .8; } to { transform: scale(1.5); opacity: 0; } }
/* Pick reticle: 2 px --pick ring, four short ticks, centre dot */
.reticle, .reticle-icon { --tick: var(--pick); position: absolute; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; pointer-events: none; display: none; }
.reticle::before, .reticle-icon::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 2px solid var(--tick); }
.reticle::after, .reticle-icon::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, var(--tick) 0 2px, transparent 2.5px) center / 6px 6px no-repeat, linear-gradient(var(--tick), var(--tick)) center top / 2px 9px no-repeat, linear-gradient(var(--tick), var(--tick)) center bottom / 2px 9px no-repeat, linear-gradient(var(--tick), var(--tick)) left center / 9px 2px no-repeat, linear-gradient(var(--tick), var(--tick)) right center / 9px 2px no-repeat; }
.reticle-icon { --tick: var(--blue); position: relative; display: block; margin: 0; }
.hover-tip { position: absolute; left: 0; top: 0; pointer-events: none; display: none; padding: 6px 11px; border-radius: var(--r-sm); background: var(--vp-2); color: var(--vp-ink); font: var(--text-label); white-space: nowrap; border: 1px solid var(--vp-line); }
.hover-tip .sw { margin-right: 7px; vertical-align: -1px; }
.hover-tip .k { color: var(--vp-muted); margin-left: 6px; }
.timebar { position: absolute; left: 14px; right: 14px; bottom: 14px; padding: 10px 16px 12px; border-radius: var(--r-md); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--space-4); }
.timebar .eyebrow { color: var(--pick); display: block; margin-bottom: 4px; font-size: 10px; }
.timebar .date { font: 500 14px var(--font-mono); }
.timebar input[type="range"] { accent-color: var(--pick); }
.tb-track { position: relative; padding-top: 2px; }
.tb-track input { position: relative; z-index: 1; margin: 0; }
.tb-ticks { position: absolute; left: 8px; right: 8px; top: -6px; height: 8px; pointer-events: none; }
.tb-ticks i { position: absolute; top: 0; width: 2px; height: 8px; border-radius: 1px; background: var(--c); transform: translateX(-1px); }
.tb-ends { display: flex; justify-content: space-between; font: var(--text-mono-s); font-weight: 400; color: var(--vp-muted); margin-top: 2px; }
.stage-loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--vp-ink); background: var(--vp); z-index: 5; text-align: center; padding: var(--space-6); font: var(--text-body); }
.stage-loading[hidden] { display: none; }
.stage-loading .blob { width: 54px; height: 32px; border-radius: 50%; margin: 0 auto var(--space-4); background: radial-gradient(closest-side, var(--pick), transparent); animation: breathe 1.4s ease-in-out infinite alternate; }
.stage-loading .hint { color: var(--vp-muted); }
@keyframes breathe { from { transform: scale(.75) rotate(-25deg); opacity: .6; } to { transform: scale(1.1) rotate(-25deg); opacity: 1; } }

.insp-empty { padding: var(--space-6) var(--space-5); }
.insp-empty h3 { font: var(--text-display-s); letter-spacing: -0.01em; margin: var(--space-4) 0 var(--space-2); }
.insp-empty p { color: var(--ink-2); margin: 0 0 var(--space-6); }
.issue-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.issue-list button { width: 100%; display: flex; align-items: center; gap: var(--space-3); padding: 9px var(--space-3); border-radius: var(--r-sm); background: var(--card); border: 1px solid var(--line); cursor: pointer; text-align: left; }
.issue-list button:hover { border-color: var(--ink-2); }
.issue-list .grow { flex: 1; min-width: 0; }
.issue-list .ds-row__title, .issue-list .ds-row__meta { display: block; }
.issue-list .ds-row__meta.mono { font-size: 11px; }
.insp-head { padding: var(--space-5) var(--space-5) var(--space-4); border-bottom: 1px solid var(--line); }
.insp-kicker { display: flex; align-items: center; gap: var(--space-2); font: var(--text-body-s); color: var(--ink-2); }
.insp-head h3 { font: var(--text-display-m); letter-spacing: -.015em; margin: var(--space-2) 0 var(--space-3); }
.insp-head .chips { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
.insp-close { margin-left: auto; border: 0; background: none; cursor: pointer; color: var(--ink-2); font-size: 18px; line-height: 1; padding: 4px 6px; border-radius: 6px; }
.insp-close:hover { background: var(--paper); color: var(--ink); }
.insp-body { padding: var(--space-4) var(--space-5) var(--space-6); display: grid; gap: var(--space-4); }
.vps-pick { position: relative; display: block; margin-top: var(--space-3); }
.vps-pick select { appearance: none; -webkit-appearance: none; width: 100%; height: 40px; border: 1px solid var(--line-2); background: var(--card); padding: 0 34px 0 30px; border-radius: var(--r-pill); font: var(--text-label); font-weight: 400; color: var(--ink); cursor: pointer; text-overflow: ellipsis; }
.vps-pick select:disabled { opacity: .5; cursor: default; }
.vps-pick::after { content: ""; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.vps-pick .vps-dot { position: absolute; left: 13px; top: 50%; margin: -4.5px 0 0; pointer-events: none; }
.vps-dot { width: 9px; height: 9px; margin: 0 2px; border-radius: 2px; transform: rotate(45deg); background: var(--c); flex: none; }
.vps-dot.none { background: none; box-shadow: inset 0 0 0 1.5px var(--muted); }
.vps-legend { list-style: none; margin: var(--space-3) 0 0; padding: 0; display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
.vps-legend li { display: flex; align-items: center; gap: 8px; }
.vps-legend .ln { width: 16px; border-top: 2px solid var(--c); flex: none; }
.vps-legend .pt { width: 7px; height: 7px; margin: 0 4.5px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px var(--ink-2); flex: none; }
table.vps-frames { font: var(--text-body-s); }
table.vps-frames th { padding: 6px; font-size: 10px; letter-spacing: .06em; }
table.vps-frames td { padding: 5px 6px; }
table.vps-frames tbody tr { cursor: default; }
table.vps-frames tbody tr:hover { background: none; }
.ok { color: var(--green); font-weight: 600; } .bad { color: var(--rust); font-weight: 600; }
.vps-why { margin: 0; font: var(--text-body-s); color: var(--ink-2); background: var(--paper); border-radius: var(--r-sm); padding: 9px 11px; }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
.metrics div { background: var(--paper); border-radius: var(--r-sm); padding: 9px 11px; }
.metrics span { display: block; font-size: 11px; color: var(--ink-2); }
.metrics b { font: 600 17px/1.3 var(--font-display); }
.metrics b.up { color: var(--rust); }
.compare { position: relative; aspect-ratio: 4 / 3; border-radius: var(--r-md); overflow: hidden; background: var(--paper-2); --pos: 50%; }
.compare .img { position: absolute; inset: 0; }
.compare .img svg { width: 100%; height: 100%; display: block; }
.compare .after { clip-path: inset(0 0 0 var(--pos)); }
.compare .divider { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; margin-left: -1px; background: var(--blue); pointer-events: none; }
.compare .divider::after { content: ""; position: absolute; top: 50%; left: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 3px var(--card); }
.compare input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
.compare .tag { position: absolute; top: 9px; padding: 4px 9px; border-radius: var(--r-pill); background: var(--card); font: var(--text-mono-s); pointer-events: none; }
.compare .tag.l { left: 9px; } .compare .tag.r { right: 9px; }
.photo { border-radius: var(--r-md); overflow: hidden; aspect-ratio: 4 / 3; }
.photo svg { width: 100%; height: 100%; display: block; }
button.photo { position: relative; display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
button.photo:focus-visible, .zoom-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.zoom-btn { position: absolute; right: 9px; bottom: 9px; z-index: 2; display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--card); color: var(--ink); cursor: zoom-in; box-shadow: var(--shadow-float); opacity: .9; transition: opacity .12s, transform .12s; }
.zoom-btn svg { width: 16px; height: 16px; }
button.photo .zoom-btn { pointer-events: none; }
button.photo:hover .zoom-btn, .zoom-btn:hover { opacity: 1; transform: scale(1.06); }
/* Photo lightbox */
.lightbox { position: fixed; inset: 0; width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; padding: 0; border: 0; background: transparent; color: #fff; }
.lightbox[open] { display: flex; flex-direction: column; animation: lb-in .15s ease-out; }
.lightbox::backdrop { background: color-mix(in srgb, #0b1220 95%, transparent); }
@keyframes lb-in { from { opacity: 0; } to { opacity: 1; } }

/* ---------- interiors (office floor, apartment) ---------- */
function buildInterior(B, spec) {
  const plaster = MAT.plaster(spec.wallColor);
  const plan = { bounds: spec.bounds, rooms: [], walls: [], items: [] };
  for (const room of spec.rooms) {
    const s = B.seg(`floor-${room.id}`, 'floor', `Floor · ${room.label}`, { short: `Floor ${room.label.toLowerCase()}` });
    const color = room.floor === 'wood' ? MAT.wood() : room.floor === 'tiles' ? MAT.tiles(room.color, room.tile || 0.3) : MAT.carpet(room.color);
    B.rect(s, [room.x0, 0, room.z0], [room.x1 - room.x0, 0, 0], [0, 0, room.z1 - room.z0], spec.sp, color, { normal: [0, 1, 0] });

  let doorN = 0, winN = 0;
  for (const w of spec.walls) {

    const g = B.wall(s, w.a, w.b, spec.H, w.t, openings, spec.sp, plaster);
    plan.walls.push({ ...w, openings });
    for (const op of openings) {
      const s0 = op.at - op.w / 2;
      const base = [w.a[0] + g.ux * s0, 0, w.a[1] + g.uz * s0];
      if (op.kind === 'door') {
        doorN++;
        const d = B.seg(`${w.id}-door-${doorN}`, 'door', op.label || `Door ${doorN}`, { short: `Door ${doorN}` });
        B.rect(d, [base[0] + g.ux * 0.02, 0, base[2] + g.uz * 0.02], [g.ux * (op.w - 0.04), 0, g.uz * (op.w - 0.04)], [0, op.y1 - 0.02, 0], 0.045, MAT.flat([0.78, 0.74, 0.66], 0.04), { normal: [g.nx, 0, g.nz] });
      } else if (op.kind === 'window') {
        winN++;
        const d = B.seg(`${w.id}-window-${winN}`, 'window', op.label || `Window ${winN}`, { short: `Window ${winN}` });
        B.rect(d, [base[0], op.y0, base[2]], [g.ux * op.w, 0, g.uz * op.w], [0, op.y1 - op.y0, 0], 0.07, MAT.glass(), { normal: [g.nx, 0, g.nz], opacity: 0.3 });
        const frame = MAT.flat([0.93, 0.93, 0.91], 0.02), fw = 0.05;
        B.rect(d, [base[0], op.y0, base[2]], [g.ux * op.w, 0, g.uz * op.w], [0, fw, 0], 0.025, frame, { normal: [g.nx, 0, g.nz], areaW: 0 });
        B.rect(d, [base[0], op.y1 - fw, base[2]], [g.ux * op.w, 0, g.uz * op.w], [0, fw, 0], 0.025, frame, { normal: [g.nx, 0, g.nz], areaW: 0 });
        B.rect(d, [base[0] + g.ux * (op.w / 2 - fw / 2), op.y0, base[2] + g.uz * (op.w / 2 - fw / 2)], [g.ux * fw, 0, g.uz * fw], [0, op.y1 - op.y0, 0], 0.025, frame, { normal: [g.nx, 0, g.nz], areaW: 0 });

    }
  }

  }
  for (const it of spec.items || []) {
    const s = B.seg(it.id, it.cls, it.label, { short: it.short });
    for (const part of it.parts) {
      const color = MAT.flat(part.color, part.jitter ?? 0.03);

    }
    const p0 = it.parts[0];
    plan.items.push(p0.cyl ? { kind: it.plan || it.cls, circle: [p0.cyl[0], p0.cyl[1], p0.cyl[2]] } : { kind: it.plan || it.cls, rect: [p0.box[0], p0.box[2], p0.box[3], p0.box[5]] });
  }
  return { plan };
}

/* ---------- bridge ---------- */
function bridgeHeight(x, z) {
  const ax = Math.abs(x);
  let h;
  if (ax < 8) h = -0.6;
  else if (ax < 14.8) { const t = (ax - 8) / 6.8; h = -0.6 + 2.8 * t * t * (3 - 2 * t); }
  else if (ax < 17.5) h = 2.2 + ((ax - 14.8) / 2.7) * 2.0;
  else h = 4.2;
  return h + (fbm(x * 0.25, 0, z * 0.25) - 0.5) * (ax > 8 ? 0.5 : 0.15);
}
function buildBridge(B) {
  const conc = MAT.concrete([0.7, 0.69, 0.66]), concDark = MAT.concrete([0.63, 0.62, 0.59]);
  const top = 4.6, bot = 4.25, X0 = -15, X1 = 15, ZW = 1.6;
  const deck = B.seg('deck', 'deck', 'Deck slab', { short: 'Deck' });
  B.rect(deck, [X0, top, -ZW], [X1 - X0, 0, 0], [0, 0, 2 * ZW], 0.065, MAT.asphalt(), { normal: [0, 1, 0] });
  B.rect(deck, [X0, bot, -ZW], [X1 - X0, 0, 0], [0, 0, 2 * ZW], 0.07, conc, { normal: [0, -1, 0], areaW: 0 });
  for (const sz of [1, -1]) B.rect(deck, [X0, bot, sz * ZW], [X1 - X0, 0, 0], [0, top - bot, 0], 0.06, conc, { normal: [0, 0, sz], areaW: 0 });
  B.box(deck, [X0, top, -ZW], [X1, top + 0.15, -ZW + 0.22], 0.06, conc, { noBottom: true });
  B.box(deck, [X0, top, ZW - 0.22], [X1, top + 0.15, ZW], 0.06, conc, { noBottom: true });
  for (const [id, label, short, z0, z1] of [['girder-n', 'Girder north', 'Girder N', -1.25, -0.85], ['girder-s', 'Girder south', 'Girder S', 0.85, 1.25]]) {
    B.box(B.seg(id, 'girder', label, { short }), [X0 + 0.3, 3.55, z0], [X1 - 0.3, bot, z1], 0.07, MAT.steel(), { noTop: true });
  }
  for (const [n, x] of [[1, -6], [2, 6]]) {
    const p = B.seg(`pier-p${n}`, 'pier', `Pier P${n}`, { short: `Pier P${n}` });
    B.cyl(p, x, 0, 0.55, -0.7, 3.1, 0.05, concDark);
    B.box(p, [x - 0.55, 3.1, -1.5], [x + 0.55, 3.4, 1.5], 0.05, conc);
    const br = B.seg(`bearings-p${n}`, 'bearing', `Bearings P${n}`, { short: `Bearings P${n}` });
    for (const z of [-1.05, 1.05]) B.box(br, [x - 0.18, 3.4, z - 0.18], [x + 0.18, 3.55, z + 0.18], 0.03, MAT.flat([0.25, 0.25, 0.27]), { noBottom: true });
  }
  for (const [id, label, short, xa, xb] of [['abutment-w', 'Abutment west', 'Abutment W', -17.5, -15], ['abutment-e', 'Abutment east', 'Abutment E', 15, 17.5]]) {
    B.box(B.seg(id, 'abutment', label, { short }), [xa, 0.8, -2.2], [xb, bot, 2.2], 0.075, conc, { noBottom: true });
  }
  const posts = [];
  for (let x = X0 + 0.25; x <= X1 - 0.2; x += 1.5) posts.push(x);
  const rail = MAT.steel([0.24, 0.29, 0.29]);
  for (const [id, label, short, z] of [['railing-n', 'Railing north', 'Railing N', -1.5], ['railing-s', 'Railing south', 'Railing S', 1.5]]) {
    const r = B.seg(id, 'railing', label, { short }), y0 = top + 0.15;
    for (const x of posts) B.box(r, [x - 0.03, y0, z - 0.03], [x + 0.03, y0 + 1.05, z + 0.03], 0.03, rail, { noBottom: true });
    B.box(r, [X0, y0 + 1.02, z - 0.04], [X1, y0 + 1.1, z + 0.04], 0.035, rail);
    B.box(r, [X0, y0 + 0.5, z - 0.015], [X1, y0 + 0.53, z + 0.015], 0.03, rail);
  }
  B.heightfield(B.seg('terrain', 'terrain', 'Embankment and riverbed', { short: 'Terrain' }), -26, 26, -10, 10, 0.17, bridgeHeight, MAT.terrain());
  B.rect(B.seg('water', 'water', 'River', { short: 'River' }), [-11, 0.15, -10], [22, 0, 0], [0, 0, 20], 0.2, MAT.water(), { normal: [0, 1, 0], opacity: 0.55, skip: (a, b) => bridgeHeight(-11 + a, -10 + b) > 0.12 });
  const terrain = [];
  for (let x = -24; x <= 24.001; x += 0.5) terrain.push([x, bridgeHeight(x, 0)]);
  return {
    elevation: {
      x0: -24, x1: 24, y0: -1.2, y1: 6.2, terrain, waterY: 0.15, waterX: [-10.25, 10.25],
      piers: [{ x: -6, label: 'P1' }, { x: 6, label: 'P2' }], pierR: 0.55, pierY: [-0.7, 3.1], cap: [3.1, 3.4, 1.1],

      abutments: [{ x0: -17.5, x1: -15, y0: 0.8, y1: bot, label: 'A-W' }, { x0: 15, x1: 17.5, y0: 0.8, y1: bot, label: 'A-E' }],
    },
  };
}

function buildDamage(B, def) {
  const s = B.seg(`dmg-${def.id}`, 'damage', `${TYPES[def.type].label} ${def.id}`, { short: TYPES[def.type].short, issueId: def.id, conf: def.obs.at(-1)[3] ?? 0.9 });
  const last = def.obs.at(-1)[2];
  const radius = TYPES[def.type].metric === 'area' ? Math.sqrt(last / Math.PI) : 0;
  switch (def.type) {
    case 'crack': B.crack(s, def.p, def.n, def.dir, last, def.seed); break;
    case 'scratch': B.crack(s, def.p, def.n, def.dir, last, def.seed, { color: [0.9, 0.82, 0.68], halo: false, width: 0.004 }); break;
    case 'corrosion': B.patch(s, def.p, def.n, radius, (e, r) => tint([lerp(0.6, 0.42, e), lerp(0.3, 0.24, e), 0.14], (r() - 0.5) * 0.16), def.seed, { spacing: 0.014 }); break;
    case 'leak': B.patch(s, def.p, def.n, radius, (e, r) => tint([0.62, 0.5, 0.34], -0.12 * (1 - e) + (r() - 0.5) * 0.04), def.seed, { stretch: [0.75, 1.35], shift: -radius * 0.35, opacity: 0.75, fade: 0.7 }); break;
    case 'mould': B.patch(s, def.p, def.n, radius, (e, r) => tint([0.18, 0.21, 0.16], (r() - 0.5) * 0.12), def.seed, { spacing: 0.012, density: 0.55, opacity: 0.9, fade: 0.5 }); break;
    case 'spalling': {
      B.patch(s, def.p, def.n, radius, (e, r) => tint([0.48, 0.47, 0.44], (r() - 0.5) * 0.14 - (1 - e) * 0.06), def.seed, { spacing: 0.015 });
      const { D, A } = B.surfaceBasis(def.n);
      for (const k of [-0.33, 0.33]) B.crack(s, [def.p[0] + A[0] * radius * k, def.p[1] + A[1] * radius * k - def.n[1] * 0.003, def.p[2] + A[2] * radius * k], def.n, D, radius * 1.5, def.seed + k * 10, { color: [0.45, 0.24, 0.12], halo: false, width: 0.009 });
      break;
    }
    case 'coating': B.patch(s, def.p, def.n, radius, (e, r) => tint([0.6, 0.59, 0.56], (r() - 0.5) * 0.08 + e * 0.1), def.seed, { spacing: 0.01 }); break;
  }
}

function finalizeSegments(segs) {
  const list = [...segs.values()];
  for (const s of list) {
    s.buf.d = Float32Array.from(s.buf.d);
    const d = s.buf.d, min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity];
    for (let i = 0; i < d.length; i += STRIDE) for (let k = 0; k < 3; k++) { min[k] = Math.min(min[k], d[i + k]); max[k] = Math.max(max[k], d[i + k]); }
    s.min = min; s.max = max;
  }
  return list;
}

const TOKEN_KEY = 'deepsplat.apiToken';

async function deleteCapture(id) {

    if (r.status === 401) {

    const q = new THREE.Quaternion(...o.camera_pose.q), t = new THREE.Vector3(...o.camera_pose.t);
    const pts = idx.map((k) => new THREE.Vector3(...corners[k]).applyQuaternion(q).add(t));
    const frustum = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: new THREE.Color(COLOR.pick), depthTest: false, transparent: true }));
    const ray = new THREE.Line(new THREE.BufferGeometry().setFromPoints([t, new THREE.Vector3(...issue.position_m)]), new THREE.LineDashedMaterial({ color: new THREE.Color(COLOR.pick), dashSize: 0.06, gapSize: 0.05, depthTest: false, transparent: true, opacity: 0.8 }));
    ray.computeLineDistances();
    frustum.renderOrder = ray.renderOrder = 999;
    this.helpers.add(frustum, ray);
  }
  project(p) {
    _p.set(p[0], p[1], p[2]).project(this.camera);
    return { x: ((_p.x + 1) / 2) * this.host.clientWidth, y: ((1 - _p.y) / 2) * this.host.clientHeight, ok: _p.z < 1 && _p.z > -1 };
  }
  updateOverlays() {
    const w = this.host.clientWidth, h = this.host.clientHeight;
    for (const p of this.pins) {
      const s = this.project(p.pos), show = p.visible && s.ok && s.x > -40 && s.x < w + 40 && s.y > -40 && s.y < h + 40;
      p.el.style.visibility = show ? 'visible' : 'hidden';
      if (show) p.el.style.transform = `translate(${s.x.toFixed(1)}px, ${s.y.toFixed(1)}px)`;
    }
    for (const m of this.vpsMarks) {
      const s = this.project(m.pos), show = m.visible && s.ok && s.x > -40 && s.x < w + 40 && s.y > -40 && s.y < h + 40;
      m.el.style.visibility = show ? 'visible' : 'hidden';
      if (show) m.el.style.transform = `translate(${s.x.toFixed(1)}px, ${s.y.toFixed(1)}px)`;
    }
    const pt = state.selection?.kind === 'segment' ? state.selection.point : null;
    if (pt) {
      const s = this.project(pt);
      this.reticle.style.display = s.ok ? 'block' : 'none';
      this.reticle.style.transform = `translate(${s.x}px, ${s.y}px)`;
    } else this.reticle.style.display = 'none';
  }
  frame(t) {
    if (!this.active) return;
    if (this.anim) {
      const a = this.anim, k = clamp((t - (a.t0 ??= t)) / a.dur, 0, 1), e = k < 0.5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2;
      this.camera.position.lerpVectors(a.fromP, a.toP, e);
      this.controls.target.lerpVectors(a.fromT, a.toT, e);
      if (k >= 1) this.anim = null;
    }
    this.controls.update();
    this.renderer.render(this.scene, this.camera);
    this.updateOverlays();
  }
  flyTo(pos, target) {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const toP = new THREE.Vector3(...pos), toT = new THREE.Vector3(...target);
    if (reduce) { this.camera.position.copy(toP); this.controls.target.copy(toT); this.anim = null; return; }
    this.anim = { fromP: this.camera.position.clone(), toP, fromT: this.controls.target.clone(), toT, dur: 950 };
  }
  viewIssue(issue) {
    const p = issue.position_m, n = issue.normal, up = Math.abs(n[1]) > 0.9;
    const dist = this.site.kind === 'structure' ? 4.2 : 3.2;
    const eye = up ? [p[0] + 0.4, p[1] + n[1] * dist, p[2] + 2.2] : [p[0] + n[0] * dist + 0.8, p[1] + 0.9, p[2] + n[2] * dist + 0.8];
    this.flyTo(eye, p);
  }
  // Closest eye position along `dir` from which every corner of the scene box stays in frame and above the time bar.
  fitEye(dir, center) {
    const [a, b] = this.site.camera.box, n = norm3(dir), cam = this.camera.clone();
    const corners = [];
    for (const x of [a[0], b[0]]) for (const y of [a[1], b[1]]) for (const z of [a[2], b[2]]) corners.push(new THREE.Vector3(x, y, z));
    for (let d = 2; d < 300; d *= 1.04) {
      cam.position.set(center[0] + n[0] * d, center[1] + n[1] * d, center[2] + n[2] * d);
      cam.lookAt(...center); cam.updateMatrixWorld(); cam.updateProjectionMatrix();
      if (corners.every((c) => { const p = c.clone().project(cam); return Math.abs(p.x) < 0.9 && p.y > -0.68 && p.y < 0.84 && p.z < 1; })) return cam.position.toArray();
    }
    return cam.position.toArray();
  }
  homeView(instant = false) {
    const { dir, center } = this.site.camera, eye = this.fitEye(dir, center);
    if (!instant) return this.flyTo(eye, center);
    this.camera.position.set(...eye); this.controls.target.set(...center); this.controls.update();
  }
  topView() {
    const { center } = this.site.camera;
    this.flyTo(this.fitEye([0, 1, 0.001], center), center);
  }
  pick(e) {
    const r = this.renderer.domElement.getBoundingClientRect();
    this.ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    this.raycaster.setFromCamera(this.ndc, this.camera);
    return this.raycaster.intersectObjects(this.meshes.filter((m) => m.visible), false)[0] || null;
  }
  setHover(mesh) {
    if (this.hovered === mesh) return;
    if (this.hovered) this.hovered.recolor.setRGB(1, 1, 1);
    this.hovered = mesh;
    if (mesh) mesh.recolor.setRGB(1.28, 1.28, 1.28);
  }
  bindPointer() {
    const el = this.renderer.domElement;
    el.addEventListener('pointerdown', (e) => { this.down = { x: e.clientX, y: e.clientY }; });
    el.addEventListener('pointerup', (e) => {
      if (!this.down) return;
      const moved = Math.hypot(e.clientX - this.down.x, e.clientY - this.down.y);
      this.down = null;
      if (moved > 5) return;
      const hit = this.pick(e);
      if (!hit) { app.clearSelection(); return; }
      const seg = hit.object.userData.seg;
      if (seg.cls === 'damage') app.selectIssue(seg.issueId, { fly: false });
      else app.selectSegment(seg.id, [hit.point.x, hit.point.y, hit.point.z]);
    });
    el.addEventListener('pointermove', (e) => {
      if (e.buttons) { this.tip.style.display = 'none'; return; }
      this.lastMove = e;
      if (this.hoverTimer) return;
      this.hoverTimer = setTimeout(() => {
        this.hoverTimer = null;
        const ev = this.lastMove, hit = this.pick(ev);
        if (!hit) { this.setHover(null); this.tip.style.display = 'none'; return; }
        const seg = hit.object.userData.seg;
        this.setHover(hit.object);
        const color = seg.cls === 'damage' ? SEV[this.site.issues.find((i) => i.issue_id === seg.issueId).severity].color : classColor(seg.cls);
        this.tip.innerHTML = `<span class="sw" style="--c:${color}"></span>${esc(seg.cls === 'damage' ? seg.issueId : seg.label)}<span class="k">${esc(seg.cls === 'damage' ? seg.short : CLASSES[seg.cls].label)}</span>`;
        const r = this.host.getBoundingClientRect();
        this.tip.style.display = 'block';
        this.tip.style.transform = `translate(${Math.min(ev.clientX - r.left + 14, r.width - this.tip.offsetWidth - 8)}px, ${ev.clientY - r.top + 16}px)`;
      }, 80);
    });
    el.addEventListener('pointerleave', () => { this.setHover(null); this.tip.style.display = 'none'; });
  }
}

/* =====================================================================
   App controller
   ===================================================================== */
let twin = null, twinSiteId = null, twinLoading = null;
const app = {
  async setSite(id) {
    state.siteId = id;
    state.selection = null; state.asOf = NOW; state.hiddenClasses.clear(); state.hiddenSegs.clear();
    closeCapture();
    state.site = await Api.getSite(id);
    $('#site-select').value = id;
    $('#stage-site').innerHTML = `${esc(state.site.name)} <span class="mono">${fmt.num(state.site.gaussians)} Gaussians</span>`;
    renderDashboard(); renderIssues(); renderCaptures(); renderLayers(); renderInspector(); renderTimebar();
    if (state.tab === 'twin') await this.ensureTwin();
    this.writeHash();
  },
  async setTab(tab) {
    state.tab = tab;
    if (tab !== 'captures') closeCapture();
    document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === `view-${tab}`));
    if (twin) twin.active = tab === 'twin';
    if (tab === 'twin') await this.ensureTwin();
    this.writeHash();
  },
  async ensureTwin() {
    const loading = $('#stage-loading');
    try {
      if (!Spark) { $('#loading-text').textContent = 'Loading the splat renderer…'; Spark = await import('@sparkjsdev/spark'); }
      if (!twin) twin = new Twin($('#stage'));
      twin.active = state.tab === 'twin';
      if (twinSiteId !== state.siteId) {
        twinSiteId = state.siteId;
        loading.hidden = false;
        $('#loading-text').textContent = state.site.live ? `Loading the scan of ${state.site.name} (${fmt.num(state.site.gaussians)} Gaussians)…` : `Building ${fmt.num(state.site.gaussians)} Gaussians for ${state.site.name}…`;
        twinLoading = twin.load(state.site);
        await twinLoading;
        loading.hidden = true;
        if (state.selection?.kind === 'issue') { const i = state.site.issues.find((x) => x.issue_id === state.selection.id); if (i) twin.viewIssue(i); }
      }
      twin.resize();
    } catch (err) {
      console.error(err);
      loading.hidden = false;
      $('#loading-text').innerHTML = `The 3D viewer could not start: ${esc(err.message)}<br><span class="hint">It needs WebGL2 and access to cdn.jsdelivr.net.</span>`;
    }
  },
  async selectIssue(id, { fly = true, obsIndex } = {}) {
    const issue = state.site.issues.find((i) => i.issue_id === id);
    if (!issue) return;
    if (!statusAt(issue, state.asOf)) { state.asOf = NOW; renderTimebar(); }
    state.selection = { kind: 'issue', id, obsIndex };
    if (state.tab !== 'twin') await this.setTab('twin');
    if (twinLoading) await twinLoading;
    renderInspector(); renderLayers();
    twin?.refresh();
    if (fly && twin) twin.viewIssue(issue);
    this.writeHash();
  },
  async selectCapture(id, { fly = true } = {}) {
    const c = state.site.captures.find((x) => x.capture_id === id);
    if (!c?.vps) return;
    if (!state.showVps) state.showVps = true;
    state.selection = { kind: 'capture', id };
    if (state.tab !== 'twin') await this.setTab('twin');
    if (twinLoading) await twinLoading;
    renderInspector(); renderLayers();
    twin?.refresh();
    if (fly && twin && c.vps.camera_pose) twin.viewCapture(c);
    this.writeHash();
  },
  selectSegment(id, point = null) {
    state.selection = { kind: 'segment', id, point };
    renderInspector(); renderLayers();
    twin?.refresh();
    this.writeHash();
  },
  clearSelection() {
    state.selection = null;
    renderInspector(); renderLayers();
    twin?.refresh();
    this.writeHash();
  },
  writeHash() {
    const parts = [state.tab, state.siteId];
    if (state.tab === 'twin' && state.selection?.kind === 'issue') parts.push(state.selection.id);
    if (state.tab === 'twin' && state.selection?.kind === 'capture') parts.push(`vps:${state.selection.id}`);
    if (state.tab === 'captures' && capView.id) parts.push(capView.id);
    const h = `#${parts.join('/')}`;
    if (location.hash !== h) history.replaceState(null, '', h);
  },
};

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

document.addEventListener('click', (e) => {
  const tabBtn = e.target.closest('.tab');
  if (tabBtn) { app.setTab(tabBtn.dataset.tab); return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'goto-tab') app.setTab(el.dataset.tab);
  else if (a === 'open-issue') app.selectIssue(el.dataset.id, { fly: !el.dataset.nofly, obsIndex: el.dataset.obs != null ? +el.dataset.obs : undefined });
  else if (a === 'select-seg') { e.preventDefault(); app.selectSegment(el.dataset.id); const m = twin?.bySeg.get(el.dataset.id); if (m) { const seg = m.userData.seg, c = seg.min.map((v, k) => (v + seg.max[k]) / 2); if (!twin.anim) twin.controls.target.set(...c); } }
  else if (a === 'select-obs') { state.selection.obsIndex = +el.dataset.index; renderInspector(); twin?.refresh(); }
  else if (a === 'zoom-photo') { const i = state.site.issues.find((x) => x.issue_id === state.selection?.id); if (i) openPhotoBox(i, +el.dataset.index); }
  else if (a === 'photo-view') { photoBox.view = el.dataset.view; renderPhotoBox(); }
  else if (a === 'photo-download') downloadPhotoBox();
  else if (a === 'photo-close') $('#photo-box').close();
  else if (a === 'fly-obs') {
    const i = state.site.issues.find((x) => x.issue_id === state.selection.id), o = i.observations[state.selection.obsIndex ?? i.observations.length - 1];
    if (!o.camera_pose) return;
    const t = o.camera_pose.t, dir = i.position_m.map((v, k) => v - t[k]);
    twin?.flyTo(t.map((v, k) => v - dir[k] * 0.35), i.position_m);
  }
  else if (a === 'clear-selection') app.clearSelection();
  else if (a === 'select-capture') { closeCapture(); app.selectCapture(el.dataset.id, { fly: !el.dataset.nofly }); }
  else if (a === 'look-capture') { const c = state.site.captures.find((x) => x.capture_id === state.selection?.id); if (c) twin?.viewCapture(c, true); }
  else if (a === 'capture-details') { app.setTab('captures').then(() => openCapture(el.dataset.id)); }
  else if (a === 'open-capture') openCapture(el.dataset.id);
  else if (a === 'close-capture') closeCapture();
  else if (a === 'cap-mode') { capView.mode = el.dataset.mode; capView.frame = null; renderCaptureSheet(); }
  else if (a === 'cap-frame') { capView.frame = +el.dataset.index; renderCaptureSheet(); }
  else if (a === 'cap-delete') { capView.confirmDelete = true; capView.deleteError = null; renderCaptureSheet(); }
  else if (a === 'cap-delete-cancel') { capView.confirmDelete = false; capView.deleteError = null; renderCaptureSheet(); }
  else if (a === 'cap-delete-confirm') confirmDeleteCapture();
  else if (a === 'toggle-class') {
    e.preventDefault(); e.stopPropagation();
    const c = el.dataset.cls;
    state.hiddenClasses.has(c) ? state.hiddenClasses.delete(c) : state.hiddenClasses.add(c);
    renderLayers(); twin?.refresh();
  }
  else if (a === 'sev-filter') { const s = el.dataset.sev; state.sevFilter.has(s) ? state.sevFilter.delete(s) : state.sevFilter.add(s); renderLayers(); twin?.refresh(); }
  else if (a === 'reset-view') twin?.homeView();
  else if (a === 'top-view') twin?.topView();
  else if (a === 'today') { state.asOf = NOW; renderTimebar(); twin?.refresh(); renderInspector(); }
  else if (a === 'toast') toast(el.dataset.msg);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('tr[data-action]')) e.target.click();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.cap[data-action]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape' && state.tab === 'twin' && state.selection && !$('#photo-box').open) app.clearSelection();
});
let paintRaf = 0;
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'ovl-alpha') { state.overlayAlpha = +t.value; cancelAnimationFrame(paintRaf); paintRaf = requestAnimationFrame(() => twin?.refresh()); }
  else if (t.id === 'asof') {
    const [start] = issueDateRange();
    state.asOf = new Date(start + +t.value * DAY + DAY - 1000);
    if (state.asOf > NOW) state.asOf = NOW;
    $('#asof-label').textContent = fmt.date(state.asOf);
    twin?.refresh();
    if (state.selection?.kind === 'issue') renderInspector();
  }
  else if (t.closest('[data-compare]')) t.closest('[data-compare]').style.setProperty('--pos', `${t.value}%`);
  else if (t.id === 'f-q') { state.issueFilter.q = t.value; renderIssueTable(); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'site-select') app.setSite(t.value);
  else if (t.id === 'ovl') { state.overlay = t.checked; renderLayers(); twin?.refresh(); }
  else if (t.id === 'show-rep') { state.showRepaired = t.checked; twin?.refresh(); }
  else if (t.id === 'show-vps') { state.showVps = t.checked; renderLayers(); twin?.refresh(); }
  else if (t.id === 'vps-low') { state.vpsLow = t.checked; twin?.refresh(); }
  else if (t.id === 'vps-select') { if (t.value) app.selectCapture(t.value); else app.clearSelection(); }
  else if (t.id === 'f-sev') { state.issueFilter.sev = t.value; renderIssueTable(); }
  else if (t.id === 'f-status') { state.issueFilter.status = t.value; renderIssueTable(); }
});
const tipEl = $('#tip');
document.addEventListener('pointerover', (e) => {
  const el = e.target.closest?.('[data-tip]');
  if (!el) { tipEl.style.display = 'none'; return; }
  tipEl.textContent = el.dataset.tip; tipEl.style.display = 'block';
});
document.addEventListener('pointermove', (e) => {
  if (tipEl.style.display !== 'block') return;
  tipEl.style.left = `${Math.min(e.clientX + 12, innerWidth - tipEl.offsetWidth - 8)}px`;
  tipEl.style.top = `${e.clientY - 34}px`;
});

/* ---------- boot ---------- */
window.deepsplat = { state, app, get twin() { return twin; } }; // console handle for debugging
// Live mode: fetch the current site every few seconds and redraw when the backend has news
// (a capture moved a step, a record was filed, the map finished processing).
async function pollLive() {
  try {
    const prev = state.site, site = await LiveApi.getSite(state.siteId);
    if (prev && site.id === state.siteId && site.sig !== prev.sig) {
      state.site = site;
      if (state.selection?.kind === 'issue' && !site.issues.some((i) => i.issue_id === state.selection.id)) state.selection = null;
      if (state.selection?.kind === 'capture' && !site.captures.some((c) => c.capture_id === state.selection.id && c.vps)) state.selection = null;
      renderDashboard(); renderCaptures(); renderLayers(); renderInspector(); renderTimebar();
      if (document.activeElement?.id === 'f-q') renderIssueTable(); else renderIssues();
      if (capView.id) openCapture(capView.id, { refresh: true });
      if (twin && twinSiteId === site.id) {
        if (site.splat_src !== prev.splat_src) { twinSiteId = null; if (state.tab === 'twin') await app.ensureTwin(); }
        else { if (twinLoading) await twinLoading; twin.update(site); }
      }
      const seen = new Set(prev.issues.flatMap((i) => i.observations.map((o) => o.obs_id)));
      const fresh = site.issues.find((i) => i.observations.some((o) => !seen.has(o.obs_id)));
      if (fresh) toast(`New record filed on ${fresh.issue_id} · ${issueTitle(fresh)}`);
    }
  } catch (err) { console.warn('Live update failed:', err); }
  setTimeout(pollLive, 4000);
}
(async function boot() {
  let sites = null;
  if (!PARAMS.has('mock')) {
    try { const list = await LiveApi.listSites(); if (Array.isArray(list)) { sites = list; LIVE = true; Api = LiveApi; } }
    catch (err) { if (PARAMS.has('api')) toast(`The backend at ${API} did not answer. Showing sample data.`); }
  }
  if (LIVE) {
    const chip = $('.sample-chip');
    chip.textContent = 'Live data'; chip.title = `Data from the backend at ${API}`; chip.className = 'ds-chip ds-chip--live';
    $('.stage-help').textContent = 'Drag to orbit · right-drag to pan · scroll to zoom · click a pin to open the issue';
    if (!sites.length) {
      $('#view-dashboard').classList.add('active');
      $('#view-dashboard').innerHTML = `<div class="page"><div class="ds-card" style="padding:var(--space-6)"><p class="ds-eyebrow">Backend connected</p><h1 class="ds-h2">No scan registered yet</h1><p>Register the trained splat as a map, then this page fills itself:</p><p class="mono">scripts/register-map.sh &lt;map-id&gt; &lt;splat.ply&gt; [views.zip]</p></div></div>`;
      while (!sites.length) { await new Promise((r) => setTimeout(r, 4000)); try { sites = await LiveApi.listSites(); } catch { /* backend restarting */ } }
    }
  } else sites = await MockApi.listSites();
  $('#site-select').innerHTML = sites.map((s) => `<option value="${esc(s.id)}">${esc(s.option)}</option>`).join('');
  const [tab, siteId, itemId] = decodeURIComponent(location.hash.slice(1)).split('/');
  const validTab = ['dashboard', 'twin', 'issues', 'captures'].includes(tab) ? tab : 'dashboard';
  const fallback = sites.some((s) => s.id === 'bridge-b17') ? 'bridge-b17' : sites[0].id;
  await app.setSite(sites.some((s) => s.id === siteId) ? siteId : fallback);
  await app.setTab(validTab);
  if (itemId && validTab === 'captures') openCapture(itemId);
  else if (itemId?.startsWith('vps:')) app.selectCapture(itemId.slice(4));
  else if (itemId) app.selectIssue(itemId);
  if (LIVE) setTimeout(pollLive, 4000);
})();
